{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omnific-{{ $name }}
  namespace: {{ $svc.namespace }}
  labels:
    {{- include "omnific.labels" (dict "name" $name "root" $) | nindent 4 }}
  {{- if $svc.needsArtifacts }}
  annotations:
    iam.gke.io/gcp-service-account: {{ include "omnific.gsa" $ | quote }}
  {{- end }}
automountServiceAccountToken: {{ ternary "true" "false" (default false $svc.automountToken) }}
{{- end }}
{{- end }}
