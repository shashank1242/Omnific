[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnific-librarian"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "omnific-common",
  "omnific-rag",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "pillow>=10",
]

[tool.uv.sources]
omnific-sim = { workspace = true }
omnific-common = { workspace = true }
omnific-rag = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/omnific_librarian"]
