{{- if eq .Values.secrets.provider "gke-secret-manager" }}
{{- $seen := dict }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.needsOpenAI (not (hasKey $seen $svc.namespace)) }}
{{- $_ := set $seen $svc.namespace true }}
---
# Mounted by the OpenAI-calling Deployments (CSI volume); the add-on materialises Secret {{ $.Values.openaiSecret.name }}.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: omnific-openai
  namespace: {{ $svc.namespace }}
  labels:
    app.kubernetes.io/part-of: omnific
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/{{ include "omnific.project" $ }}/secrets/{{ $.Values.secrets.secretManagerName }}/versions/{{ $.Values.secrets.secretManagerVersion }}"
        path: "openai-api-key"
  secretObjects:
    - secretName: {{ $.Values.openaiSecret.name }}
      type: Opaque
      data:
        - objectName: openai-api-key
          key: {{ $.Values.openaiSecret.key }}
{{- end }}
{{- end }}
{{- end }}
