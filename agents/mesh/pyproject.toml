[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnific-mesh"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "omnific-common",
  "numpy",
  "trimesh>=4.4",
  "fast-simplification>=0.1.7",
  "pygltflib>=1.16",
  "pillow>=10.1",
  "rtree>=1.2",
  "scipy",
]

[tool.uv.sources]
omnific-sim = { workspace = true }
omnific-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/omnific_mesh"]
