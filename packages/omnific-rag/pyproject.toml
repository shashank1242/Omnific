[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnific-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "omnific-common",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "psycopg-pool>=3.2",
]

[tool.uv.sources]
omnific-sim = { workspace = true }
omnific-common = { workspace = true }
omnific-rag = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/omnific_rag"]
