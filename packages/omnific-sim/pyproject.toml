[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnific-sim"
version = "0.1.0"
description = "Tested solver primitives and the SimSpec contract shared by all Omnific agents"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pint>=0.23",
  "pydantic>=2.6",
  "sympy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/omnific_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
