[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnific-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "omnific-common",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[tool.uv.sources]
omnific-sim = { workspace = true }
omnific-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/omnific_api"]
