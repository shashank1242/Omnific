# Local stack: docker compose up --build   (copy .env.example to .env first)
x-common: &common
  env_file: .env
  environment: &common-env
    TEMPORAL_ADDRESS: temporal:7233
    ARTIFACT_STORE: s3
    S3_BUCKET: omnific
    S3_ENDPOINT_URL: http://s3:9000
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    RAG_DATABASE_URL: postgresql://omnific:${RAG_DB_PASSWORD:-omnific}@postgres:5432/omnific_rag
    MCP_GATEWAY_URL: http://mcp-gateway:8811/mcp
    MCP_GATEWAY_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN:-omnific-local-dev}
  depends_on:
    temporal:
      condition: service_started
    postgres:
      condition: service_healthy
    s3-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  temporal:
    image: temporalio/temporal:latest
    # a database file on a volume: jobs survive restarts and rebuilds (in-memory dev mode lost every running job)
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    user: "0:0"   # the named volume is root-owned
    volumes:
      - temporal-data:/data
    restart: unless-stopped   # comes back after a Docker restart, like the services
    ports:
      - "7233:7233"
      - "8233:8233"   # Temporal UI

  postgres:   # pgvector store for the document library (docs/rag.md)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: omnific
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:-omnific}
      POSTGRES_DB: omnific_rag
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnific -d omnific_rag"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  mcp-gateway:   # Docker MCP gateway: MCP tools for the researcher (docs/rag.md)
    image: docker/mcp-gateway:latest
    command:
      - --transport=streaming
      - --port=8811
      - --servers=${MCP_SERVERS:-duckduckgo,fetch,arxiv-mcp-server,wikipedia-mcp,paper-search}
      - --verify-signatures
      - --block-secrets
    environment:
      MCP_GATEWAY_AUTH_TOKEN: ${MCP_GATEWAY_AUTH_TOKEN:-omnific-local-dev}
    ports:
      - "127.0.0.1:8811:8811"   # host access for scripts/e2e_local.py; loopback only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # the gateway starts each MCP server as its own container
    restart: unless-stopped

  # S3-compatible artifact store. RustFS (Apache-2.0) replaces MinIO, whose images are no longer on Docker Hub.
  # Artifacts in an old minio-data volume are not carried over: local Temporal (start-dev) is in-memory, so no
  # job outlives a restart to reference them.
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-minioadmin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3 API (scripts on the host: S3_ENDPOINT_URL=http://localhost:9000)
      - "9001:9001"   # web console
    volumes:
      - s3-data:/data
    restart: unless-stopped

  s3-init:   # creates the bucket; reuses the API image (boto3) instead of a separate client image
    build: {context: ., dockerfile: services/api/Dockerfile}
    image: omnific-api   # same tag as api: built once, shared
    depends_on: [s3]
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, time, boto3
        s3 = boto3.client("s3", endpoint_url="http://s3:9000", region_name="us-east-1",
                          aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
                          aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"])
        for attempt in range(60):
            try:
                if "omnific" not in [b["Name"] for b in s3.list_buckets().get("Buckets", [])]:
                    s3.create_bucket(Bucket="omnific")
                print("bucket omnific ready"); break
            except Exception as e:
                print("waiting for s3:", type(e).__name__); time.sleep(1)
        else:
            raise SystemExit("s3 never became ready")
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    restart: "no"

  api:
    <<: *common
    build: {context: ., dockerfile: services/api/Dockerfile}
    image: omnific-api
    ports:
      - "8000:8000"

  web:
    build: {context: apps/web}
    environment:
      OMNIFIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on: [api]
    restart: unless-stopped

  workflows:
    <<: *common
    build: {context: ., dockerfile: services/workflows/Dockerfile}

  researcher:
    <<: *common
    build: {context: ., dockerfile: agents/researcher/Dockerfile}

  modeler:
    <<: *common
    build: {context: ., dockerfile: agents/modeler/Dockerfile}

  solver-coder:
    <<: *common
    build: {context: ., dockerfile: agents/solver_coder/Dockerfile}

  data:
    <<: *common
    build: {context: ., dockerfile: agents/data/Dockerfile}

  mesh:
    <<: *common
    build: {context: ., dockerfile: agents/mesh/Dockerfile}
    environment:
      <<: *common-env
      # mesh router routes (docs/architecture.md): CAD runs in the sandbox's CAD runner (built below); the generated
      # route only when the gpu profile runs; model libraries need their index / keys (.env.example)
      MESH_CAD_ENABLED: ${MESH_CAD_ENABLED:-1}
      MESH_GPU_ENABLED: ${MESH_GPU_ENABLED:-0}   # start the gpu profile with MESH_GPU_ENABLED=1 (.env)
      MESH_LIBRARY_SOURCES: ${MESH_LIBRARY_SOURCES:-}

  # SceneBuild GPU stages (TRELLIS.2 needs a >=24 GB NVIDIA GPU). Opt in: docker compose --profile gpu up
  mesh-gpu:
    <<: *common
    build:
      context: .
      dockerfile: agents/mesh_gpu/Dockerfile
      # only the local card's arch (RTX 50-series = 12.0) keeps the CUDA-extension compile short and within memory
      args: {CUDA_ARCHS: "${MESH_GPU_CUDA_ARCHS:-12.0}", MAX_JOBS: "${MESH_GPU_MAX_JOBS:-2}"}
    profiles: ["gpu"]
    environment:
      <<: *common-env
      HF_HOME: /models
      # 512 fits a 12 GB laptop GPU; 1024_cascade (upstream default) wants ~24 GB, e.g. the GKE L4
      MESH_GEN_PIPELINE: ${MESH_GEN_PIPELINE:-512}
    volumes:
      - model-cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, count: 1, capabilities: [gpu]}

  intake:
    <<: *common
    build: {context: ., dockerfile: agents/intake/Dockerfile}

  clarifier:
    <<: *common
    build: {context: ., dockerfile: agents/clarifier/Dockerfile}

  librarian:
    <<: *common
    build: {context: ., dockerfile: agents/librarian/Dockerfile}

  evaluator:
    <<: *common
    build: {context: ., dockerfile: agents/evaluator/Dockerfile}

  # Scene dressing (docs/architecture.md): writes the Blender scripts and judges the Blender runner's output. The
  # scripts themselves only run in the Blender runner (sandbox). DRESS_ENABLED=0 in .env turns dressing off.
  dress:
    <<: *common
    build: {context: ., dockerfile: agents/dress/Dockerfile}

  sandbox:
    <<: *common
    build: {context: ., dockerfile: sandbox/Dockerfile}
    # Local dev only: the docker backend needs the host Docker socket. On GKE the worker is non-root and
    # uses the Kubernetes API (SANDBOX_BACKEND=k8s) instead.
    user: root
    environment:
      <<: *common-env
      SANDBOX_BACKEND: docker
      SANDBOX_IMAGE: omnific-sandbox-runner
      SANDBOX_CAD_IMAGE: omnific-cad-runner
      SANDBOX_BLENDER_IMAGE: omnific-blender-runner
      SANDBOX_WORK_DIR: /tmp/omnific-sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # same path on host and in the worker: runner-container bind mounts resolve on the Docker host
      - /tmp/omnific-sandbox:/tmp/omnific-sandbox
    depends_on:
      sandbox-runner-build:
        condition: service_completed_successfully
      cad-runner-build:
        condition: service_completed_successfully
      blender-runner-build:
        condition: service_completed_successfully
      temporal:
        condition: service_started
      s3-init:
        condition: service_completed_successfully

  # Build-only: produces the image the sandbox worker launches per run (exits immediately).
  # Build it alone with: docker compose build sandbox-runner-build
  sandbox-runner-build:
    build: {context: ., dockerfile: sandbox/runner.Dockerfile}
    image: omnific-sandbox-runner
    entrypoint: ["true"]   # the image's entrypoint is the harness; this service only builds the image
    restart: "no"

  # Build-only: the CAD runner (build123d) the sandbox worker launches for the mesh router's cad route.
  cad-runner-build:
    build: {context: ., dockerfile: sandbox/cad-runner.Dockerfile}
    image: omnific-cad-runner
    entrypoint: ["true"]
    restart: "no"

  # Build-only: the Blender runner (bpy) the sandbox worker launches for scene dressing and .blend exports.
  blender-runner-build:
    build: {context: ., dockerfile: sandbox/blender-runner.Dockerfile}
    image: omnific-blender-runner
    entrypoint: ["true"]
    restart: "no"

volumes:
  temporal-data:
  model-cache:
  pg-data:
  s3-data:
