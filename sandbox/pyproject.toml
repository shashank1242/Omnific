[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnific-sandbox"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "omnific-common",
  "docker>=7",
  "kubernetes>=30",
]

[tool.uv.sources]
omnific-sim = { workspace = true }
omnific-common = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/omnific_sandbox"]
