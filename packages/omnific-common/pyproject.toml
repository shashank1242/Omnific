[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnific-common"
version = "0.1.0"
description = "Pipeline contracts, OpenAI client wrapper, artifact storage and Temporal helpers shared by Omnific services"
requires-python = ">=3.11"
dependencies = [
  "omnific-sim",
  "openai>=1.80",
  "temporalio>=1.10",
  "boto3>=1.34",
  "pydantic>=2.6",
  "google-cloud-storage>=2.16",
]

[tool.uv.sources]
omnific-sim = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/omnific_common"]
